<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.PNG" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yayasan Binar Community — organisasi yang bergerak di bidang kesehatan mental anak dan remaja di Indonesia. #Berbinar Untuk Bersinar" />

    <!-- Preconnect: siapkan koneksi ke Google Fonts lebih awal -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts: non-blocking stylesheet (display=swap) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />

    <title>Yayasan Binar Community</title>
  </head>
  <body>
    <div id="root">
      <!-- Loading screen: tampil INSTAN sebelum React selesai load -->
      <!-- Otomatis hilang saat React merender dan mengganti isi #root -->
      <div id="app-shell" style="
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font-family: 'Poppins', system-ui, sans-serif;
        z-index: 9999;
      ">
        <!-- Logo placeholder -->
        <div style="
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
        ">
          <div style="
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.15em;
            text-transform: uppercase;
          ">Yayasan</div>
          <div style="
            font-size: 22px;
            font-weight: 800;
            color: #1d4ed8;
            letter-spacing: -0.02em;
          ">Binar Community</div>
          <div style="
            font-size: 11px;
            font-weight: 500;
            color: #94a3b8;
          ">#Berbinar Untuk Bersinar ✨</div>
        </div>
        <!-- Spinner animasi -->
        <div style="
          width: 36px;
          height: 36px;
          border: 3px solid #e2e8f0;
          border-top-color: #1d4ed8;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        "></div>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
          /* Fade out saat React siap */
          #app-shell.fade-out {
            animation: fadeOut 0.3s ease forwards;
          }
          @keyframes fadeOut {
            to { opacity: 0; pointer-events: none; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
